# Render Blueprint: 백엔드(FastAPI) 웹 서비스 + 프론트엔드(Vite) 정적 사이트
# Render 대시보드 → New → Blueprint 에서 이 저장소를 선택하면 두 서비스가 함께 만들어진다.
# sync: false 인 값은 생성 화면에서 직접 입력한다(저장소에는 남지 않음).
services:
  - type: web
    name: ai-yaho-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: ANTHROPIC_API_KEY   # 비워두면 mock 모드로 동작
        sync: false
      - key: LAW_API_OC          # 국가법령정보 API 키 (선택)
        sync: false
      - key: ALLOWED_ORIGINS     # 프론트엔드 주소, 예: https://ai-yaho-web.onrender.com
        sync: false

  - type: web
    name: ai-yaho-web
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL        # 백엔드 주소, 예: https://ai-yaho-api.onrender.com
        sync: false
